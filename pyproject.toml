[project]
name = "argos"
version = "0.1.0"
description = "Agentic Red-teaming & Guardrail-stripped Offensive System : mesure du compromis refus/raisonnement lors de l'abliteration de LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shaïma Derouich" }]

dependencies = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.30",
    "datasets>=2.20",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "lm-eval>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
argos = "argos.cli:main"
argos-measure = "argos.measure:main"
argos-sweep = "argos.sweep:main"
argos-detect = "argos.detect:main"
argos-detect-blind = "argos.detect_blind:main"
argos-demo = "argos.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argos*"]
